<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your ballot — Rollcall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,800;1,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0e6;--ink:#151c33;--muted:#5b6478;--red:#a82a2a;--line:#e3dccb;--card:#fff;--gold:#c9a24b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.narrow{max-width:820px;margin:0 auto}
header{border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:22px}
.links{display:flex;align-items:center;gap:32px;font-weight:500}
.links a:hover,.links a.on{color:var(--red)}
.btn{display:inline-block;border:0;cursor:pointer;font:600 16px Inter,sans-serif;padding:14px 28px;border-radius:999px;background:var(--red);color:#fff}
.btn.dark{background:var(--ink);padding:10px 20px;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.burger{display:none;background:none;border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;font:600 14px Inter;color:var(--ink);cursor:pointer}
.mono{font-family:'JetBrains Mono',monospace;font-size:13px}
.kicker{color:var(--red);font:500 13px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.kicker:before{content:"";width:24px;height:2px;background:var(--red)}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(32px,4.6vw,48px);line-height:1.1;letter-spacing:-.02em}
.top{padding:48px 0 24px}
.lead{color:var(--muted);margin-top:12px}
.head{background:var(--ink);color:#fff;border-radius:20px;padding:24px 28px;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0 32px}
.head dt{color:var(--gold);font:500 12px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.head dd{font-family:Fraunces,Georgia,serif;font-size:22px;margin-top:2px;word-break:break-word}
fieldset{border:0;margin-bottom:28px}
legend{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:16px;font-size:15px}
.cand{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:12px;cursor:pointer}
.cand:hover{border-color:var(--ink)}
.cand:has(input:checked){border-color:var(--red);background:#fbf1ee}
.cand b{display:block;font-size:18px}
.cand small{color:var(--muted);font-size:14px}
.pick{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;white-space:nowrap}
.pick input{width:24px;height:24px;accent-color:var(--red);cursor:pointer}
.field{margin-bottom:18px}
label.t{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=email],input[type=text]{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);font:16px Inter,sans-serif;background:#fff;color:var(--ink)}
input[readonly]{background:#efe8d6;color:var(--muted)}
.req{color:var(--red)}
.confirm{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:24px;font-size:15px;color:var(--muted)}
.confirm input{width:20px;height:20px;margin-top:3px;accent-color:var(--red);flex:none}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.warn{color:var(--muted);font-size:14px;margin-bottom:72px}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:14px}


/* ===== Election Details Card ===== */

#ballot-container {
    position: relative;
    overflow: hidden;
    margin: 28px 0;
    padding: 30px;
    border-radius: 20px;

    background: linear-gradient(
        135deg,
        #101d43 0%,
        #172f63 55%,
        #244b83 100%
    );

    color: #ffffff;
    box-shadow: 0 12px 30px rgba(17, 36, 78, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.12);
}

/* Decorative glow */
#ballot-container::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    top: -120px;
    right: -70px;
    border-radius: 50%;
    background: rgba(103, 167, 255, 0.15);
    pointer-events: none;
}

/* Election detail rows */
.election-details {
    position: relative;
    display: grid;
    grid-template-columns: minmax(110px, 0.8fr) minmax(0, 1.5fr);
    gap: 22px 28px;
    align-items: start;
}

/* Left-side labels */
.election-details .detail-label {
    color: #f5c76b;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.3px;
    text-transform: uppercase;
}

/* Right-side values */
.election-details .detail-value {
    color: #ffffff;
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

/* Election title */
.election-details .election-title {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.3px;
}

/* Candidate list */
#candidates {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin: 24px 0;
}

/* Individual candidate option */
#candidates .candidate-option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 17px 20px;
    border: 1px solid #dce4f0;
    border-radius: 14px;
    background: #ffffff;
    color: #172554;
    cursor: pointer;
    transition: border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
}

#candidates .candidate-option:hover {
    border-color: #547ce8;
    background: #f4f7ff;
    box-shadow: 0 5px 16px rgba(37, 73, 150, 0.09);
}

#candidates .candidate-option:has(input:checked) {
    border-color: #315de8;
    background: #edf2ff;
    box-shadow: 0 0 0 3px rgba(49, 93, 232, 0.10);
}

#candidates input[type="radio"] {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
    accent-color: #315de8;
    cursor: pointer;
}

#candidates .candidate-name {
    font-size: 1rem;
    font-weight: 600;
    overflow-wrap: anywhere;
}

/* Mobile responsiveness */
@media (max-width: 600px) {
    #ballot-container {
        padding: 22px 18px;
        border-radius: 16px;
    }

    .election-details {
        grid-template-columns: 1fr;
        gap: 6px;
    }

    .election-details .detail-value {
        margin-bottom: 12px;
        font-size: 0.98rem;
    }

    .election-details .election-title {
        font-size: 1.25rem;
    }

    #candidates .candidate-option {
        padding: 15px;
    }
}

@media(max-width:720px){
 .burger{display:block}
 .links{display:none;position:absolute;left:0;right:0;top:72px;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;padding:16px 24px 24px;gap:16px;z-index:5}
 .links.open{display:flex}
 header{position:relative}
 .head{grid-template-columns:1fr;padding:20px}
 .cand{padding:16px}
 .actions .btn{width:100%;text-align:center}

}

</style>
<script src="http://localhost:5000/socket.io/socket.io.js"></script>
<script src="script.js" defer></script>

<script>
  document.addEventListener("DOMContentLoaded",()=>{
    const savedData = sessionStorage.getItem("ballot_details");

    if(!savedData){
      console.error("No ballot details");
      return;
    }

    const data = JSON.parse(savedData);

    renderBallot(data);

    sessionStorage.removeItem("ballot_details");
  });
</script>
</head>
<body>
<header>
 <div class="wrap nav">
  <a class="logo" href="index.html">R&nbsp; Rollcall</a>
  <button class="burger" id="burger" aria-expanded="false" aria-controls="links">Menu</button>
  <nav class="links" id="links">
   <a href="index.html">Home</a>
   <a href="dashboard.html">Dashboard</a>
   <a class="on" href="vote.html">Vote with a code</a>

   <button class="btn" id="ResultBtn">Results</button>
  </nav>
 </div>
</header>

<main class="wrap">
 <div class="narrow">
  <section class="top" id="headingballot">
   <p class="kicker" >Your ballot</p>
   <h1>Choose one candidate.</h1>
   <p class="lead">Select one option, confirm, and submit. You can vote only once and cannot change it afterwards.</p>
  </section>

  <div id="ballot-container"></div>

  <div id="candidates"></div>

   <label class="confirm" id="confirm-box">
    <input type="checkbox" id="confirm" name="confirm" required>
    <span>I confirm that I am the voter on the electoral roll for this election, and that my choice above is final. <span class="req">*</span></span>
   </label>

   <div class="actions" id="actions">
    <button class="btn" id ="poll-vote-btn" type="submit" onclick="poll_vote()">Poll vote</button>
   </div>
   <p class="warn"><span class="req">*</span> Required. Results are shown on the results page after voting closes.</p>
  </form>
 </div>
</main>

<footer><div class="wrap mono">Rollcall — One voter, one vote.</div></footer>

<script>
function toggleMenu(){
  var links=document.getElementById('links'),b=document.getElementById('burger');
  var open=links.classList.toggle('open');
  b.setAttribute('aria-expanded',open);
}
document.getElementById('burger').addEventListener('click',toggleMenu);
</script>
</body>
</html>
